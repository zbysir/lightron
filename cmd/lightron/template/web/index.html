<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{.Name}}</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
      body { max-width: 560px; margin: 64px auto; padding: 0 20px; }
      input, button { font: inherit; padding: 6px 10px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>{{.Name}}</h1>
    <p>
      <input id="name" value="world" />
      <button id="greet">Greet from Go</button>
    </p>
    <p id="out"></p>
    <script>
      document.getElementById("greet").onclick = async () => {
        const name = document.getElementById("name").value;
        document.getElementById("out").textContent = await lightron.invoke("greet", name);
      };
    </script>
  </body>
</html>
