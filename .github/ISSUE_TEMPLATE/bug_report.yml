name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest program that shows it, or steps with examples/hello.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lightron doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The app's log
      description: What Lightron printed (Options.Logf; stderr by default). On macOS, LIGHTRON_DEBUG=1 adds the menu library's log.
      render: text
